<!DOCTYPE html>
<html>
<head>
  <title>Checkbox Grid</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <h2>⚡ Real-Time Checkbox Grid</h2>

    <div id="login">
      <input id="username" placeholder="Enter your name" />
      <button onclick="login()">Join</button>
    </div>

    <div id="topbar">
      <span id="userBadge">Not connected</span>
    </div>

    <div id="loading">Loading checkboxes...</div>

    <div id="grid"></div>

    <div id="toast"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
